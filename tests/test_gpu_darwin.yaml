device_utilization_from_performance_statistics:
  - name: device_utilization
    stats:
      "Device Utilization %": 12
      "Device Unit 0 Utilization %": 40
    expected: 12.0
  - name: pstate_fallback
    stats:
      "Device Utilization % at cur p-state": 7
    expected: 7.0
  - name: unit_max_fallback
    stats:
      "Device Unit 0 Utilization %": 5
      "Device Unit 1 Utilization %": 18
    expected: 18.0
  - name: missing
    stats:
      orphanedReusableVidMemoryHitRate: 45
    expected: null
  - name: gpu_activity
    stats:
      "GPU Activity(%)": 44
    expected: 44.0
  - name: amd_activity_over_zero_device
    stats:
      "Device Utilization %": 0
      "GPU Activity(%)": 79
    expected: 79.0
  - name: intel_device_preferred
    stats:
      "Device Utilization %": 8
      "Device Utilization % at cur p-state": 30
    expected: 8.0

decode_registry_model:
  - name: nul_terminated_bytes
    value_hex: "496e74656c205548442047726170686963732036333000"
    expected: "Intel UHD Graphics 630"
  - name: plain_bytes
    value_hex: "414d4420526164656f6e2050726f20353530304d"
    expected: "AMD Radeon Pro 5500M"
  - name: empty
    value_hex: ""
    expected: null

gpu_display_name:
  - name: model_wins
    io_class: IntelAccelerator
    model: Intel UHD Graphics 630
    expected: Intel UHD Graphics 630
  - name: intel_class
    io_class: IntelAccelerator
    model: null
    expected: Intel
  - name: amd_class
    io_class: AMDRadeonX6000_AMDNavi14GraphicsAccelerator
    model: null
    expected: AMD
  - name: unknown
    io_class: null
    model: null
    expected: GPU

sort_gpu_devices:
  - name: intel_before_amd
    devices:
      - name: AMD Radeon Pro 5500M
        util_pct: null
      - name: Intel UHD Graphics 630
        util_pct: 6.0
    expected:
      - name: Intel UHD Graphics 630
        util_pct: 6.0
      - name: AMD Radeon Pro 5500M
        util_pct: null

is_gpu_accelerator:
  - name: intel
    io_class: IntelAccelerator
    expected: true
  - name: apple
    io_class: AGXAcceleratorG17X
    expected: true
  - name: amd
    io_class: AMDRadeonX6000_AMDNavi14GraphicsAccelerator
    expected: true
  - name: user_client
    io_class: AGXDeviceUserClient
    expected: false
  - name: missing
    io_class: null
    expected: false

unique_gpu_devices:
  - name: drop_duplicate_name
    devices:
      - name: Apple M5 Max
        util_pct: null
      - name: Apple M5 Max
        util_pct: 4.0
    expected:
      - name: Apple M5 Max
        util_pct: 4.0
  - name: keep_distinct_gpus
    devices:
      - name: AMD Radeon Pro 5500M
        util_pct: null
      - name: Intel UHD Graphics 630
        util_pct: 6.0
    expected:
      - name: Intel UHD Graphics 630
        util_pct: 6.0
      - name: AMD Radeon Pro 5500M
        util_pct: null
