format_tooltip:
  - name: full_snapshot
    snapshot:
      cpu_celsius: 42.5
      gpu_celsius: 39.0
      cpu_util_pct: 8.0
      gpu_util_pct: 22.0
      fan_rpms: [1346, 1456]
      system_power_w: 13.9
      battery_power_w: 8.4
      external_connected: false
      battery_pct: 98.0
      error: null
    expected_contains:
      - "CPU: 42.5°C"
      - "CPU: 8%"
      - "GPU: 39.0°C"
      - "GPU: 22%"
      - "System power: 13.9 W"
      - "Battery power: 8.4 W"
      - "Battery: 98%"
      - "Fan 1: 1346 RPM"
      - "Fan 2: 1456 RPM"
  - name: fanless
    snapshot:
      cpu_celsius: 35.0
      gpu_celsius: null
      cpu_util_pct: null
      gpu_util_pct: null
      fan_rpms: []
      error: null
    expected_contains:
      - "CPU: 35.0°C"
      - "Fans: none / fanless"

decode_smc_value:
  - name: float_temperature
    raw_hex: "00004242"
    data_type: 1718383648
    data_size: 4
    expected: 48.5
  - name: sp78_temperature
    raw_hex: "28c0"
    data_type: 0
    data_size: 2
    expected: 40.75

smc_key_to_uint:
  - name: fan_key
    key: "F0Ac"
    expected: 1177567587
