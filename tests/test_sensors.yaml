format_tooltip:
  - name: full_snapshot
    snapshot:
      machine_model: MacBook Pro (Mac17,6)
      chip_name: Apple M5 Max
      cpu_cores: 18
      gpu_core_counts:
        - name: Apple M5 Max
          cores: 32
      disk_name: APPLE SSD AP2048Z
      disk_medium: SSD
      disk_used_gb: 127.4
      disk_total_gb: 1858.0
      cpu_celsius: 42.5
      gpu_celsius: 39.0
      cpu_util_pct: 8.0
      gpu_util_pct: 22.0
      memory_used_gb: 11.5
      memory_total_gb: 36.0
      fan_rpms: [1346, 1456]
      system_power_w: 13.9
      battery_power_w: 8.4
      external_connected: false
      battery_pct: 98.0
      error: null
    expected_contains:
      - "MacBook Pro (Mac17,6)"
      - "Chip: Apple M5 Max"
      - "SSD: APPLE SSD AP2048Z"
      - "CPU: 8% 42.5°C 18 cores"
      - "GPU: 22% 39.0°C 32 cores"
      - "Memory: 11.5 / 36.0 GB (32%)"
      - "Disk: 127.4 / 1858.0 GB (7%)"
      - "Battery charge: 98%"
      - "Battery power: 8.4 W"
      - "System power: 13.9 W"
      - "Fan 1: 1346 RPM"
      - "Fan 2: 1456 RPM"
    expected_first_line: MacBook Pro (Mac17,6)
  - name: fanless
    snapshot:
      cpu_celsius: 35.0
      gpu_celsius: null
      cpu_util_pct: null
      gpu_util_pct: null
      fan_rpms: []
      error: null
    expected_contains:
      - "CPU: 35.0°C"
      - "Fans: none / fanless"
    expected_first_line: System monitor
  - name: dual_gpus
    snapshot:
      cpu_celsius: 41.2
      gpu_celsius: 40.1
      cpu_util_pct: 12.4
      gpu_util_pct: 6.0
      fan_rpms: []
