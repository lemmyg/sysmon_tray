format_tray_label:
  - name: dual_fans
    snapshot:
      cpu_celsius: 41.2
      gpu_celsius: 39.8
      cpu_util_pct: 12.4
      gpu_util_pct: 36.2
      fan_rpms: [1351, 1455]
      error: null
    expected: "c12% c41° g36% g40° f1351+ f1455+"
  - name: with_fans_and_power
    snapshot:
      cpu_celsius: 41.2
      gpu_celsius: 39.8
      cpu_util_pct: 12.4
      gpu_util_pct: 36.2
      fan_rpms: [1351, 1455]
      system_power_w: 13.9
      external_connected: true
      error: null
    expected: "c12% c41° g36% g40° s14W b0W f1351+ f1455+"
  - name: with_system_power
    snapshot:
      cpu_celsius: 41.2
      gpu_celsius: 39.8
      cpu_util_pct: 12.4
      gpu_util_pct: 36.2
      fan_rpms: []
      system_power_w: 13.9
      external_connected: true
      error: null
    expected: "c12% c41° g36% g40° s14W b0W"
  - name: with_battery_power
    snapshot:
      cpu_celsius: 41.2
      gpu_celsius: 39.8
      cpu_util_pct: 12.4
      gpu_util_pct: 36.2
      fan_rpms: []
      system_power_w: 13.9
      battery_power_w: 8.4
      external_connected: false
      error: null
    expected: "c12% c41° g36% g40° s14W b8W"
  - name: with_battery_pct
    snapshot:
      cpu_celsius: 41.2
      gpu_celsius: 39.8
      cpu_util_pct: 12.4
      gpu_util_pct: 36.2
      fan_rpms: [1351, 1455]
      system_power_w: 13.9
      battery_power_w: 8.4
      external_connected: false
      battery_pct: 98.0
      error: null
    expected: "c12% c41° g36% g40° s14W b8W b98% f1351+ f1455+"
  - name: fanless
    snapshot:
      cpu_celsius: 35.0
      gpu_celsius: null
      cpu_util_pct: null
      gpu_util_pct: null
      fan_rpms: []
      error: null
    expected: "c-- c35° g-- g--"
  - name: with_memory
    snapshot:
      cpu_celsius: 41.2
      gpu_celsius: 39.8
      cpu_util_pct: 12.4
      gpu_util_pct: 36.2
      memory_used_gb: 11.5
      memory_total_gb: 36.0
      fan_rpms: []
      error: null
    expected: "c12% c41° g36% g40° m11.5G"
  - name: only_temps_enabled
    snapshot:
      cpu_celsius: 41.2
      gpu_celsius: 39.8
      cpu_util_pct: 12.4
      gpu_util_pct: 36.2
      fan_rpms: [1351, 1455]
      system_power_w: 13.9
      battery_power_w: 8.4
      external_connected: false
      battery_pct: 98.0
      error: null
    components:
      cpu_util: false
      cpu_temp: true
      gpu_util: false
      gpu_temp: true
      memory: false
      system_power: false
      battery_power: false
      battery_pct: false
      fans: false
    expected: "c41° g40°"
  - name: all_components_disabled
    snapshot:
      cpu_celsius: 41.2
      gpu_celsius: 39.8
      cpu_util_pct: 12.4
      gpu_util_pct: 36.2
      fan_rpms: [1351]
      error: null
    components:
      cpu_util: false
      cpu_temp: false
      gpu_util: false
      gpu_temp: false
      memory: false
      system_power: false
      battery_power: false
      battery_pct: false
      fans: false
    expected: "--"

format_tooltip:
  - name: full_snapshot
    snapshot:
      cpu_celsius: 42.5
      gpu_celsius: 39.0
      cpu_util_pct: 8.0
      gpu_util_pct: 22.0
      memory_used_gb: 11.5
      memory_total_gb: 36.0
      fan_rpms: [1346, 1456]
      system_power_w: 13.9
      battery_power_w: 8.4
      external_connected: false
      battery_pct: 98.0
      error: null
    expected_contains:
      - "CPU: 42.5°C"
      - "CPU: 8%"
      - "GPU: 39.0°C"
      - "GPU: 22%"
      - "Memory: 11.5 / 36.0 GB (32%)"
      - "System power: 13.9 W"
      - "Battery power: 8.4 W"
      - "Battery: 98%"
      - "Fan 1: 1346 RPM"
      - "Fan 2: 1456 RPM"
  - name: fanless
    snapshot:
      cpu_celsius: 35.0
      gpu_celsius: null
      cpu_util_pct: null
      gpu_util_pct: null
      fan_rpms: []
      error: null
    expected_contains:
      - "CPU: 35.0°C"
      - "Fans: none / fanless"

