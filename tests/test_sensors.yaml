format_metric_pair_tray_part:
  - name: both_values
    prefix: "C"
    first_value: 5.0
    first_suffix: "%"
    show_first: true
    second_value: 37.0
    second_suffix: "°"
    show_second: true
    expected: "C5%37°"
  - name: first_only
    prefix: "G"
    first_value: 1.0
    first_suffix: "%"
    show_first: true
    second_value: 37.0
    second_suffix: "°"
    show_second: false
    expected: "G1%"
  - name: second_only
    prefix: "C"
    first_value: null
    first_suffix: "%"
    show_first: false
    second_value: 35.0
    second_suffix: "°"
    show_second: true
    expected: "C35°"
  - name: both_disabled
    prefix: "C"
    first_value: 5.0
    first_suffix: "%"
    show_first: false
    second_value: 37.0
    second_suffix: "°"
    show_second: false
    expected: null

