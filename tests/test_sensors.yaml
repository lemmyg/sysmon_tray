      cpu_celsius: 42.5
      gpu_celsius: 39.0
      cpu_util_pct: 8.0
      gpu_util_pct: 22.0
      memory_used_gb: 11.5
      memory_total_gb: 36.0
      fan_rpms: [1346, 1456]
      system_power_w: 13.9
      battery_power_w: 8.4
      external_connected: false
      battery_pct: 98.0
      error: null
    expected_contains:
      - "CPU: 42.5°C"
      - "CPU: 8%"
      - "GPU: 39.0°C"
      - "GPU: 22%"
      - "Memory: 11.5 / 36.0 GB (32%)"
