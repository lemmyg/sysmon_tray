format_refresh_interval_label:
  - name: whole_seconds
    seconds: 2.0
    expected: "2s"
  - name: five_seconds
    seconds: 5.0
    expected: "5s"
  - name: fractional_seconds
    seconds: 2.5
    expected: "2.5s"
  - name: half_second_label
    seconds: 0.5
    expected: "0.5s"

format_about_text:
  - name: default_block
    expected: "sysmon_tray\nMinimalist MacOS system stats widget by lemmyg.\nMIT License."

seconds_to_milliseconds:
  - name: two_seconds
    seconds: 2.0
    expected: 2000
  - name: half_second
    seconds: 0.5
    expected: 500

status_item_delegate_set_refresh_interval:
  - name: two_seconds
    tag_ms: 2000
    expected_seconds: 2.0
  - name: half_second
    tag_ms: 500
    expected_seconds: 0.5

status_item_length_for_title_width:
  - name: default_padding
    title_width: 120.0
    padding: null
    expected: 136.0
  - name: custom_padding
    title_width: 80.0
    padding: 10.0
    expected: 90.0
  - name: zero_width
    title_width: 0.0
    padding: 16.0
    expected: 16.0
  - name: negative_width_clamped
    title_width: -5.0
    padding: 16.0
    expected: 16.0

toggle_label_component:
  - name: disable_cpu_util
    key: cpu_util
    components:
      cpu_util: true
      cpu_temp: true
    expected:
      cpu_util: false
      cpu_temp: true
  - name: enable_fans
    key: fans
    components:
      fans: false
    expected:
      fans: true

label_component_key_for_tag:
  - name: cpu_util
    tag: 0
    expected: cpu_util
  - name: fans
    tag: 9
    expected: fans
  - name: memory
    tag: 4
    expected: memory
  - name: memory_pct
    tag: 5
    expected: memory_pct

status_item_delegate_toggle_component:
  - name: cpu_temp
    tag: 1
    expected_key: cpu_temp
  - name: battery_pct
    tag: 8
    expected_key: battery_pct
  - name: memory_pct
    tag: 5
    expected_key: memory_pct

status_item_click_action:
  - name: single_click
    click_count: 1
    button_number: 0
    expected: menu_delayed
  - name: double_click
    click_count: 2
    button_number: 0
    expected: activity_monitor
  - name: right_click
    click_count: 1
    button_number: 1
    expected: menu

status_item_delegate_status_bar_button_clicked:
  - name: single_click_schedules_menu
    click_count: 1
    button_number: 0
    expected: menu_delayed
  - name: double_click_launches_activity_monitor
    click_count: 2
    button_number: 0
    expected: activity_monitor
  - name: right_click_shows_menu
    click_count: 1
    button_number: 1
    expected: menu

