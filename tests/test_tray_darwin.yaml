format_refresh_interval_label:
  - name: whole_seconds
    seconds: 2.0
    expected: "2s"
  - name: five_seconds
    seconds: 5.0
    expected: "5s"
  - name: fractional_seconds
    seconds: 2.5
    expected: "2.5s"
  - name: half_second_label
    seconds: 0.5
    expected: "0.5s"

format_about_text:
  - name: default_block
    expected: "sysmon_tray\nMinimalist MacOS system stats widget by lemmyg.\nMIT License."

seconds_to_milliseconds:
  - name: two_seconds
    seconds: 2.0
    expected: 2000
  - name: half_second
    seconds: 0.5
    expected: 500

status_item_delegate_set_refresh_interval:
  - name: two_seconds
    tag_ms: 2000
    expected_seconds: 2.0
  - name: half_second
    tag_ms: 500
    expected_seconds: 0.5

status_item_length_for_title_width:
  - name: default_padding
    title_width: 120.0
    padding: null
    expected: 136.0
  - name: custom_padding
    title_width: 80.0
    padding: 10.0
    expected: 90.0
  - name: zero_width
    title_width: 0.0
    padding: 16.0
    expected: 16.0
  - name: negative_width_clamped
    title_width: -5.0
    padding: 16.0
    expected: 16.0

toggle_label_component:
  - name: disable_cpu_util
    key: cpu_util
    components:
      cpu_util: true
      cpu_temp: true
    expected:
      cpu_util: false
      cpu_temp: true
  - name: enable_fans
    key: fans
    components:
      fans: false
    expected:
      fans: true

gpu_component_key:
  - name: first_util
    index: 0
    kind: util
    expected: gpu0_util
  - name: second_temp
    index: 1
    kind: temp
    expected: gpu1_temp

gpu_component_title:
  - name: first_util
    index: 0
    kind: util
    expected: "GPU0 %"
  - name: second_temp
    index: 1
    kind: temp
    expected: "GPU1 °C"

is_gpu_component_key:
  - name: gpu0_util
    key: gpu0_util
    expected: true
  - name: gpu1_temp
    key: gpu1_temp
    expected: true
  - name: shared_gpu_util
    key: gpu_util
    expected: false
  - name: cpu_util
    key: cpu_util
    expected: false

label_components_for_gpu_count:
  - name: single_keeps_shared
    gpu_count: 1
    expected_keys:
      - cpu_util
      - cpu_temp
      - gpu_util
      - gpu_temp
      - memory
      - memory_pct
      - disk
      - disk_pct
      - system_power
      - battery_power
      - battery_pct
      - fans
    expected_titles:
      - "CPU %"
      - "CPU °C"
      - "GPU %"
      - "GPU °C"
      - "Memory GB"
      - "Memory %"
      - "Disk GB"
      - "Disk %"
      - "System power W"
      - "Battery power W"
      - "Battery charge %"
      - "Fans"
  - name: dual_expands_gpu0_gpu1
    gpu_count: 2
    expected_keys:
      - cpu_util
      - cpu_temp
      - gpu0_util
      - gpu0_temp
      - gpu1_util
      - gpu1_temp
      - memory
      - memory_pct
      - disk
      - disk_pct
      - system_power
      - battery_power
      - battery_pct
      - fans
    expected_titles:
      - "CPU %"
      - "CPU °C"
      - "GPU0 %"
      - "GPU0 °C"
      - "GPU1 %"
      - "GPU1 °C"
      - "Memory GB"
      - "Memory %"
      - "Disk GB"
      - "Disk %"
      - "System power W"
      - "Battery power W"
      - "Battery charge %"
      - "Fans"

ensure_gpu_component_defaults:
  - name: inherit_shared_flags
    gpu_count: 2
    components:
      gpu_util: false
      gpu_temp: true
    expected:
      gpu_util: false
      gpu_temp: true
      gpu0_util: false
      gpu0_temp: true
      gpu1_util: false
      gpu1_temp: true
  - name: keep_existing_per_gpu
    gpu_count: 2
    components:
      gpu_util: true
      gpu_temp: true
      gpu1_util: false
    expected:
      gpu_util: true
      gpu_temp: true
      gpu0_util: true
      gpu0_temp: true
      gpu1_util: false
      gpu1_temp: true
  - name: single_unchanged
    gpu_count: 1
    components:
      gpu_util: false
    expected:
      gpu_util: false

is_gpu_metric_enabled:
  - name: per_gpu_off
    index: 1
    kind: util
    gpu_count: 2
    components:
      gpu_util: true
      gpu1_util: false
    expected: false
  - name: inherit_shared
    index: 0
    kind: temp
    gpu_count: 2
    components:
      gpu_temp: false
    expected: false
  - name: single_uses_shared
    index: 0
    kind: util
    gpu_count: 1
    components:
      gpu_util: true
    expected: true

persistable_component_keys:
  - name: shared_plus_gpu
    components:
      cpu_util: true
      gpu0_util: false
      gpu1_temp: true
    expected:
      - cpu_util
      - cpu_temp
      - gpu_util
      - gpu_temp
      - memory
      - memory_pct
      - disk
      - disk_pct
      - system_power
      - battery_power
      - battery_pct
      - fans
      - gpu0_util
      - gpu1_temp

label_component_key_for_tag:
  - name: cpu_util
    tag: 0
    expected: cpu_util
  - name: fans
    tag: 11
    expected: fans
  - name: memory
    tag: 4
    expected: memory
  - name: memory_pct
    tag: 5
    expected: memory_pct
  - name: disk_pct
    tag: 7
    expected: disk_pct
  - name: disk
    tag: 6
    expected: disk

status_item_delegate_toggle_component:
  - name: cpu_temp
    tag: 1
    expected_key: cpu_temp
  - name: battery_pct
    tag: 10
    expected_key: battery_pct
  - name: memory_pct
    tag: 5
    expected_key: memory_pct
  - name: disk_pct
    tag: 7
    expected_key: disk_pct
  - name: disk
    tag: 6
    expected_key: disk

status_item_click_action:
  - name: single_click
    click_count: 1
    button_number: 0
    expected: menu_delayed
  - name: double_click
    click_count: 2
    button_number: 0
    expected: activity_monitor
  - name: right_click
    click_count: 1
    button_number: 1
    expected: menu

status_item_delegate_status_bar_button_clicked:
  - name: single_click_schedules_menu
    click_count: 1
    button_number: 0
    expected: menu_delayed
  - name: double_click_launches_activity_monitor
    click_count: 2
    button_number: 0
    expected: activity_monitor
  - name: right_click_shows_menu
    click_count: 1
    button_number: 1
    expected: menu

