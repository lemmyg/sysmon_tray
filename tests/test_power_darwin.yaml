milliwatts_to_watts:
  - name: idle_draw
    milliwatts: 9987
    expected: 9.987
  - name: zero
    milliwatts: 0
    expected: 0.0

battery_power_from_voltage_amperage:
  - name: discharging
    voltage_mv: 11209
    amperage_ma: -1227
    expected: 13.753443
  - name: charging
    voltage_mv: 12600
    amperage_ma: 1500
    expected: 0.0
  - name: missing_voltage
    voltage_mv: null
    amperage_ma: -1000
    expected: null
  - name: missing_amperage
    voltage_mv: 11000
    amperage_ma: null
    expected: null

battery_discharge_w:
  - name: on_battery_with_reading
    battery_power_w: 8.4
    system_power_w: 13.9
    external_connected: false
    expected: 8.4
  - name: on_battery_fallback
    battery_power_w: 0.0
    system_power_w: 13.9
    external_connected: false
    expected: 13.9
  - name: on_ac_idle
    battery_power_w: 0.0
    system_power_w: 13.9
    external_connected: true
    expected: 0.0

format_battery_power_part:
  - name: on_battery
    battery_power_w: 8.4
    system_power_w: 13.9
    external_connected: false
    expected: "b8W"
  - name: on_battery_fallback
    battery_power_w: 0.0
    system_power_w: 13.9
    external_connected: false
    expected: "b14W"
  - name: on_ac_idle
    battery_power_w: 0.0
    system_power_w: 13.9
    external_connected: true
    expected: "b0W"
  - name: missing_battery
    battery_power_w: null
    system_power_w: 13.9
    external_connected: null
    expected: null

battery_percent:
  - name: modern_percentage
    current_capacity: 98
    max_capacity: 100
    expected: 98.0
  - name: raw_mah
    current_capacity: 8173
    max_capacity: 8805
    expected: 92.822259
  - name: current_only
    current_capacity: 75
    max_capacity: null
    expected: 75.0
  - name: missing
    current_capacity: null
    max_capacity: 100
    expected: null

format_battery_pct_part:
  - name: charged
    battery_pct: 98.0
    expected: "b98%"
  - name: missing
    battery_pct: null
    expected: null
