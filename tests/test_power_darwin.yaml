milliwatts_to_watts:
  - name: idle_draw
    milliwatts: 9987
    expected: 9.987
  - name: zero
    milliwatts: 0
    expected: 0.0

battery_discharge_w:
  - name: on_battery_with_reading
    battery_power_w: 8.4
    system_power_w: 13.9
    external_connected: false
    expected: 8.4
  - name: on_battery_fallback
    battery_power_w: 0.0
    system_power_w: 13.9
    external_connected: false
    expected: 13.9
  - name: on_ac_idle
    battery_power_w: 0.0
    system_power_w: 13.9
    external_connected: true
    expected: 0.0

format_battery_power_part:
  - name: on_battery
    battery_power_w: 8.4
    system_power_w: 13.9
    external_connected: false
    expected: "8W"
  - name: on_battery_fallback
    battery_power_w: 0.0
    system_power_w: 13.9
    external_connected: false
    expected: "14W"
  - name: on_ac_idle
    battery_power_w: 0.0
    system_power_w: 13.9
    external_connected: true
    expected: "0W"
  - name: missing_battery
    battery_power_w: null
    system_power_w: 13.9
    external_connected: null
    expected: null
